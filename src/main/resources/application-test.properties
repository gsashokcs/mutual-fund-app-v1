# Test Profile - H2 In-Memory Database Configuration

# DataSource Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hikari Connection Pool Configuration
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.max-lifetime=600000

# H2 Console (disabled in tests)
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable security for simpler testing
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Cache Configuration (use simple cache for tests)
spring.cache.type=simple

# Logging Configuration (Test)
logging.level.com.mutualfund=INFO
logging.level.org.springframework=WARN

# Disable Actuator in tests
management.endpoints.enabled-by-default=false
