# Production Profile - H2 Configuration

# DataSource Configuration
spring.datasource.url=jdbc:h2:file:./data/mutualfunddb

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# Connection Pool Configuration (production-specific overrides)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration (Production)
logging.level.com.mutualfund=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Override if needed to secure actuator endpoints further
